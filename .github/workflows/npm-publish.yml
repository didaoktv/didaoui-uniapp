name: publish-to-npm

# 推送 v* tag 即自动发布；认证走 npm Trusted Publisher (OIDC)，无长期 token
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC：npm 据此换取短期发布凭据
    steps:
      - uses: actions/checkout@v4

      # 刻意不配 registry-url：它会写入 _authToken，让 npm 跳过 OIDC 走 token 认证（E404）
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@^11.5.1

      # 版本与 tag 对齐：v2.17.1 -> package.json version = 2.17.1
      - name: Align version from tag
        run: node -e "const p=require('./package.json');p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - run: npm install

      - name: Type check
        run: npm run type-check

      # prepublishOnly 会再次校验 publishConfig.access 为 public，失败即停止
      - name: Publish to npm
        run: npm publish
